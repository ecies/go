name: govulncheck

on:
  workflow_call:
  pull_request:
  schedule:
    - cron: "0 3 * * *" # Run at 3am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: |
          # Always print findings for debugging, even if they're all ignored.
          govulncheck ./... || true
          
          # Run govulncheck and process results.
          govulncheck -json ./... > /tmp/govuln.json || true
          trap "rm -f /tmp/govuln.json" EXIT
          FINDINGS=$(jq -r 'select((.finding.trace | length) > 1) | .finding.osv // empty' /tmp/govuln.json | sort -u)
          if [ -z "$FINDINGS" ]; then
            exit 0
          fi
          
          # Load ignore list.
          IGNORE_IDS=""
          if [ -f ".govulnignore" ]; then
            IGNORE_IDS=$(sed 's/[[:space:]]*#.*//' .govulnignore \
              | tr '[:upper:]' '[:lower:]' \
              | grep -v '^[[:space:]]*$')
          fi
          
          # Check findings against ignore list.
          EXIT_CODE=0
          while IFS= read -r osv_id; do
            [ -z "$osv_id" ] && continue
          
            osv_lower=$(echo "$osv_id" | tr '[:upper:]' '[:lower:]')
            ALIASES=$(jq -r --arg id "$osv_id" \
              'select(.osv != null) | select(.osv.id == $id) | .osv.aliases[]?' \
              /tmp/govuln.json 2>/dev/null | tr '[:upper:]' '[:lower:]')
          
            IGNORED=false
            for check_id in $osv_lower $ALIASES; do
              if echo "$IGNORE_IDS" | grep -qxF "$check_id"; then
                echo "Ignoring $osv_id (matched .govulnignore entry: $check_id)"
                IGNORED=true
                break
              fi
            done

            if [ "$IGNORED" = false ]; then
              echo "::error::Unignored vulnerability: $osv_id"
              EXIT_CODE=1
            fi
          done <<< "$FINDINGS"

          exit $EXIT_CODE

  file-issue:
    needs: govulncheck
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - run: |
          existing=$(gh issue list --search "govulncheck: in:title" --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open, skipping."
            exit 0
          fi
          gh issue create \
            --title "govulncheck: Vulnerability detected" \
            --body "The daily govulncheck run found a vulnerability. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
