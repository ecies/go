name: goversioncompatibility

on:
  workflow_call:
  schedule:
    - cron: "0 3 * * 1" # Weekly on Monday at 3am UTC

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - go-version-file: go.mod
          - go-version: stable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
      - run: go test ./...

  file-issue:
    needs: test
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - run: |
          existing=$(gh issue list --search "goversioncompatibility: in:title" --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open, skipping."
            exit 0
          fi
          gh issue create \
            --title "goversioncompatibility: Test failure detected" \
            --body "The weekly goversioncompatibility test failed. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
