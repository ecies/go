name: gocooldowncheck

on:
  workflow_call:
  pull_request:
    paths:
      - go.mod

permissions:
  contents: read

jobs:
  gocooldowncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # External callers (workflow_call from another repo) need cross-repo read
      # on the private go-standards repo; their GITHUB_TOKEN is scoped to the
      # caller repo only and 404s here. On go-standards' own PRs the default
      # GITHUB_TOKEN suffices (same repo), so the mint is skipped there.
      - name: Mint App token for go-standards checkout
        id: app-token
        if: github.repository != 'chronicleprotocol/go-standards'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHRONICLE_GITHUB_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHRONICLE_GITHUB_BOT_PRIVATE_KEY }}
          owner: chronicleprotocol
          repositories: go-standards
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: chronicleprotocol/go-standards
          path: go-standards
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go install ./cmd/gocooldowncheck
        working-directory: go-standards
      - run: gocooldowncheck .

  file-issue:
    needs: gocooldowncheck
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - run: |
          existing=$(gh issue list --search "gocooldowncheck: in:title" --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open, skipping."
            exit 0
          fi
          gh issue create \
            --title "gocooldowncheck: Cooldown violation detected" \
            --body "A dependency in go.mod does not satisfy the 14-day cooldown. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
